[package]
name = "scanner-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "scanner_core"
crate-type = ["rlib"]

[dependencies]
# Tree-sitter core and language grammars
tree-sitter = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-java = "0.20"

# Serialization for index caching
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Utilities
glob = "0.3"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false
